[package]
name = "credit-exchanger"
version = "0.2.1"
edition = "2024"
repository = "https://github.com/Dost-2-0-FK/credit-exchanger"

[dependencies]
actix-web = "4.12.1"
actix-web-lab = "0.24.3"
anyhow = "1.0.100"
derive_more = { version = "2.1.0", features = ["constructor"] }
env_logger = "0.11.8"
futures-util = "0.3.32"
log = "0.4.29"
mongodb = "2.0"
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1", features = ["fs", "full"] }
toml = "0.9.10"
utoipa = { version = "5.5.0", features = ["actix_extras"] }
utoipa-actix-web = "0.1.2"
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web"] }

[dev-dependencies]
mockito = "1.7.0"
serial_test = "3.2.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
